<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jokers Wild</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A poker roguelike deck-builder built as an offline-capable web app for iPhone.">
<meta name="theme-color" content="#232b33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jokers Wild">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ── Title screen ─────────────────────────────────────────────── -->
  <section id="screen-menu" class="screen">
    <div class="menu-wrap">
      <h1 class="logo"><span class="logo-j">JOKERS</span><span class="logo-w">WILD</span></h1>
      <p class="tagline">a poker roguelike</p>

      <div class="menu-buttons">
        <button id="btn-continue" class="btn btn-big btn-blue hidden">Continue Run</button>
        <button id="btn-new-run" class="btn btn-big btn-red">New Run</button>
        <button id="btn-collection" class="btn btn-small">Collection</button>
        <button id="btn-how" class="btn btn-small">How to Play</button>
      </div>

      <div id="run-setup" class="panel hidden">
        <h2 class="panel-title">Choose a Deck</h2>
        <div id="deck-list" class="deck-list"></div>
        <label class="seed-row">
          <span>Seed</span>
          <input id="seed-input" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="random">
        </label>
        <div class="row-buttons">
          <button id="btn-start" class="btn btn-blue">Start Run</button>
          <button id="btn-cancel-setup" class="btn btn-ghost">Back</button>
        </div>
      </div>

      <p class="footnote">An original fan-made tribute to the poker roguelike genre.<br>Add to Home Screen for full-screen play.</p>
    </div>
  </section>

  <!-- ── Run screen ───────────────────────────────────────────────── -->
  <section id="screen-run" class="screen hidden">

    <header id="hud">
      <button id="hud-menu" class="hud-btn" aria-label="Menu">☰</button>
      <div class="hud-block">
        <span class="hud-label">Ante</span>
        <span id="hud-ante" class="hud-value">1<span class="hud-sub">/8</span></span>
      </div>
      <div class="hud-block">
        <span class="hud-label">Round</span>
        <span id="hud-round" class="hud-value">1</span>
      </div>
      <div class="hud-block hud-money">
        <span class="hud-label">Money</span>
        <span id="hud-money" class="hud-value">$4</span>
      </div>
      <button id="hud-deck" class="hud-btn" aria-label="View deck">🎴</button>
    </header>

    <div id="blind-banner" class="blind-banner hidden">
      <div class="bb-icon" id="bb-icon">🔹</div>
      <div class="bb-text">
        <div class="bb-name" id="bb-name">Small Blind</div>
        <div class="bb-desc" id="bb-desc"></div>
      </div>
      <div class="bb-req">
        <div class="bb-req-label">Score at least</div>
        <div class="bb-req-value" id="bb-req">300</div>
      </div>
    </div>

    <div id="score-bar" class="score-bar hidden">
      <div class="sb-round">
        <span class="sb-label">Round score</span>
        <span class="sb-value" id="sb-score">0</span>
      </div>
      <div class="sb-progress"><div class="sb-progress-fill" id="sb-fill"></div></div>
    </div>

    <div id="calc-row" class="calc-row hidden">
      <div class="calc-chips" id="calc-chips">0</div>
      <div class="calc-x">×</div>
      <div class="calc-mult" id="calc-mult">0</div>
      <div class="calc-hand" id="calc-hand"></div>
    </div>

    <div id="jokers-strip" class="strip">
      <div class="strip-head"><span id="jokers-count">0/5</span></div>
      <div id="jokers-row" class="card-row"></div>
    </div>

    <div id="consumables-strip" class="strip strip-small">
      <div class="strip-head"><span id="cons-count">0/2</span></div>
      <div id="consumables-row" class="card-row"></div>
    </div>

    <main id="stage"></main>

    <div id="play-area" class="play-area hidden"></div>

    <footer id="hand-dock" class="hidden">
      <div id="hand-row" class="hand-row"></div>
      <div class="action-row">
        <button id="btn-play" class="btn btn-blue btn-action">Play Hand</button>
        <div class="sort-group">
          <button id="btn-sort-rank" class="btn btn-tiny active">Rank</button>
          <button id="btn-sort-suit" class="btn btn-tiny">Suit</button>
        </div>
        <button id="btn-discard" class="btn btn-red btn-action">Discard</button>
      </div>
      <div class="counters">
        <div class="counter counter-hands"><span id="ct-hands">4</span><small>Hands</small></div>
        <div class="counter counter-discards"><span id="ct-discards">3</span><small>Discards</small></div>
        <div class="counter counter-deck"><span id="ct-deck">52/52</span><small>Deck</small></div>
      </div>
    </footer>
  </section>

  <!-- ── Overlays ─────────────────────────────────────────────────── -->
  <div id="overlay" class="overlay hidden"></div>
  <div id="toasts" class="toasts"></div>
  <div id="fx" class="fx"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
